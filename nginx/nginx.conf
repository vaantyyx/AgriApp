worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Round-robin (default) across the 3 backend replicas. Each is a separate
  # Node process; Redis (configured in server.js) keeps Socket.IO broadcasts
  # in sync between them, so it doesn't matter which one a given user lands on.
  upstream sougra_backend {
    server backend1:3001;
    server backend2:3001;
    server backend3:3001;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://sougra_backend;

      # Required for Socket.IO's WebSocket upgrade — without these two
      # headers, the connection silently falls back to (slower) HTTP
      # long-polling, or fails outright depending on client config.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # So the app sees the real visitor IP/host instead of this proxy's —
      # matches the TRUST_PROXY=1 setting in the backend's own config.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket connections are long-lived — the default 60s read/send
      # timeout would silently drop idle-but-open Socket.IO connections.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
