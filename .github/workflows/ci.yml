name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/agriapp_test
      JWT_SECRET: ci-test-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # `npm run lint` is intentionally not run here yet: the codebase currently
      # has ~130 pre-existing ESLint errors (mostly unused `React` imports from
      # before the new JSX transform, plus some react-hooks rules) unrelated to
      # this CI setup. Wiring it in now would make every run fail regardless of
      # what a PR actually changes. Fix that backlog, then add the step back.
      - run: npm test
      - run: npm run build
